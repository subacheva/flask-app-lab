<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title or "Лабораторна 8" }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"></head>
<body><nav class="navbar navbar-expand bg-dark navbar-dark"><div class="container"><a class="navbar-brand" href="{{ url_for('posts.all_posts') }}">Публікації</a><div class="navbar-nav"><a class="nav-link" href="{{ url_for('posts.all_users') }}">Автори</a><a class="nav-link" href="{{ url_for('posts.create_user') }}">Додати автора</a><a class="nav-link" href="{{ url_for('posts.create_tag') }}">Додати тег</a><a class="nav-link" href="{{ url_for('posts.create_post') }}">Новий пост</a></div></div></nav><main class="container py-4">{% for category,message in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
