{% extends 'base.html' %}
{% block content %}
<div class="user-layout">
  <aside class="user-menu" aria-label="Меню користувача">
    <h2>Користувачі</h2>
    <a href="{{ url_for('users.greetings', name='John', age=30) }}">Привітання</a>
    <a href="{{ url_for('users.admin') }}">Сторінка адміністратора</a>
    <a href="{{ url_for('products.product_list') }}">Товари</a>
  </aside>
  <section class="user-greeting">
    <p class="eyebrow">Blueprint users</p>
    <h1>Вітаємо, {{ name }}!</h1>
    {% if age %}<p>Вік: <strong>{{ age }}</strong></p>{% endif %}
    <p>Ця сторінка відображається з окремого шаблону Blueprint користувачів.</p>
  </section>
</div>
{% endblock %}
