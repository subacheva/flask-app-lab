{% extends 'base.html' %}
{% block content %}
<article class="product-detail">
  <p class="eyebrow">Детальна інформація про товар № {{ product.id }}</p>
  <h1>{{ product.name }}</h1>
  <p class="product-description">{{ product.content }}</p>
  <p class="product-price">${{ product.price }}</p>
  <a class="text-link" href="{{ url_for('products.product_list') }}">← Повернутися до каталогу</a>
</article>
{% endblock %}
