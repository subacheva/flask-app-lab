<header class="site-header">
  <nav class="navbar navbar-expand-lg container" aria-label="Головна навігація">
    <a class="navbar-brand" href="{{ url_for('home') }}">УС<span>.</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Відкрити меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Головна</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('resume') }}">Резюме</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('users.profile') if session.get('username') else url_for('users.login') }}">Профіль</a></li>
        {% if session.get('username') %}
          <li class="nav-item"><form method="post" action="{{ url_for('users.logout') }}"><button class="nav-link btn btn-link" type="submit">Вийти</button></form></li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('users.login') }}">Вхід</a></li>
        {% endif %}
        <li class="nav-item"><a class="nav-link" href="{{ url_for('contacts') }}">Контакти</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('products.product_list') }}">Товари</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('users.greetings', name='John', age=30) }}">Користувач</a></li>
      </ul>
    </div>
  </nav>
</header>
