{% extends 'base.html' %}
{% block content %}
<article class="post-detail"><p class="eyebrow">{{ post.category }} · {{ post.posted.strftime('%d.%m.%Y %H:%M') }}</p><h1>{{ post.title }}</h1><p class="post-author">Автор: {{ post.author }}</p><div class="post-content">{{ post.content }}</div><div class="d-flex flex-wrap gap-2 mt-4"><a class="btn btn-accent" href="{{ url_for('posts.edit_post', post_id=post.id) }}">Edit</a><a class="btn btn-outline-danger" href="{{ url_for('posts.delete_post', post_id=post.id) }}">Delete</a><a class="btn btn-outline-dark" href="{{ url_for('posts.all_posts') }}">До списку</a></div></article>
{% endblock %}
