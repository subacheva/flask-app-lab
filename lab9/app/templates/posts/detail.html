{% extends "base.html" %}{% block content %}<article><h1>{{ post.title }}</h1><p>{{ post.category }} · {{ post.posted.strftime('%d.%m.%Y %H:%M') }}</p><p>Автор: {{ post.author.username }}</p><div class="content">{{ post.content }}</div><div class="my-3">{% for tag in post.tags %}<span class="badge text-bg-primary me-1">{{ tag.name }}</span>{% endfor %}</div><a class="btn btn-primary" href="{{ url_for('posts.edit_post', post_id=post.id) }}">Редагувати</a><a class="btn btn-danger" href="{{ url_for('posts.delete_post', post_id=post.id) }}">Видалити</a></article>{% endblock %}
