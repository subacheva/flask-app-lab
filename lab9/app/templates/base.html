<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title or "Лабораторна 9" }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"></head>
<body><nav class="navbar navbar-expand bg-dark navbar-dark"><div class="container"><a class="navbar-brand" href="{{ url_for('posts.all_posts') }}">Публікації</a><div class="navbar-nav"><a class="nav-link" href="{{ url_for('posts.all_posts') }}">Пости</a>{% if current_user.is_authenticated %}<a class="nav-link" href="{{ url_for('auth.account') }}">Профіль</a><a class="nav-link" href="{{ url_for('posts.all_users') }}">Користувачі</a><form method="post" action="{{ url_for('auth.logout') }}" class="d-flex">{{ logout_form.csrf_token }}<button class="nav-link btn btn-link">Вихід</button></form>{% else %}<a class="nav-link" href="{{ url_for('auth.register') }}">Реєстрація</a><a class="nav-link" href="{{ url_for('auth.login') }}">Вхід</a>{% endif %}</div></div></nav><main class="container py-4">{% for category,message in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ 'success' if category == 'success' else 'warning' if category == 'warning' else 'danger' if category == 'error' else 'info' }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
